<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset='utf-8'>
    <meta http-equiv="X-UA-Compatible" content="chrome=1">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link rel="SHORTCUT ICON" href="images/favicon.ico">
    <link rel="icon" href="images/favicon.ico" type="image/gif">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;700&display=swap" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;700&display=swap');

        .tool-form {
            margin-top: 1.5rem;
        }

        .tool-label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 700;
        }

        .tool-input {
            width: 100%;
            box-sizing: border-box;
            padding: 0.8rem 1rem;
            border: 1px solid #2f2f2f;
            border-radius: 6px;
            background: #ffffff;
            color: #222;
            font-size: 1rem;
            font-family: 'Noto Sans JP', sans-serif;
        }

        .button-row {
            display: flex;
            flex-wrap: wrap;
            gap: 0.8rem;
            margin-top: 1rem;
        }

        .action-button {
            border: 1px solid #2f2f2f;
            background: #f5f5f5;
            color: #222;
            border-radius: 6px;
            padding: 0.7rem 1rem;
            font-size: 0.95rem;
            cursor: pointer;
            font-family: 'Noto Sans JP', sans-serif;
        }

        .action-button:hover {
            background: #e8e8e8;
        }

        .status {
            margin-top: 1rem;
            min-height: 1.4rem;
        }

        .share-url-description {
            margin-top: 1.2rem;
            margin-bottom: 0.4rem;
        }

        .share-url {
            margin: 0 0 0.8rem;
            word-break: break-all;
        }

        .qr-code {
            margin-top: 1rem;
            display: inline-block;
            padding: 0.4rem;
            border: 1px solid #d0d0d0;
            background: #fff;
        }

        @media (max-width: 768px) {
            .button-row {
                flex-direction: column;
                gap: 0.9rem;
            }

            .action-button {
                width: 100%;
                padding: 1rem 1.1rem;
                font-size: 1.05rem;
            }
        }
    </style>

    <link rel="stylesheet" type="text/css" href="stylesheets/stylesheet.css" media="screen"/>
    <link rel="stylesheet" type="text/css" href="stylesheets/pygment_trac.css" media="screen"/>

    <title>SNS Hashtag Tool | PhalanXware</title>
</head>

<body>

<header>
    <div class="container">
        <h1>SNS with Hashtag</h1>
    </div>
</header>

<div class="container">
    <section id="main_content">
        <p>
            ハッシュタグをスペース区切りで入力し、コピー・X投稿・シェアに利用できます。ハッシュタグ部分を編集すると、自動でもろもろ反映されます。
        </p>

        <div class="tool-form">
            <label class="tool-label" for="hashtags">ハッシュタグ</label>
            <input
                    id="hashtags"
                    class="tool-input"
                    type="text"
                    placeholder="#kanazawa #ruby #aws"
                    autocomplete="off"
            />

            <div class="button-row">
                <button id="copyButton" class="action-button" type="button">クリップボードにコピー</button>
                <button id="openXButton" class="action-button" type="button">Xで開く</button>
                <button id="shareButton" class="action-button" type="button">シェアする</button>
            </div>

            <p id="hashtagCopyStatus" class="status" aria-live="polite"></p>

            <hr>
            <p class="share-url-description">このウェブページ自体をシェアするためのURLです。イベントの最初とかにシェアしておくといいかも。</p>
            <p id="pageUrl" class="share-url"></p>
            <button id="copyUrlButton" class="action-button" type="button">このURLをコピーする</button>
            <br>
            <div id="pageQrCode" class="qr-code" aria-label="共有URLのQRコード"></div>

            <p id="status" class="status" aria-live="polite"></p>
        </div>
    </section>
</div>

<footer>
    <div class="container">
        <h2>
            Page Information.
        </h2>
        <p class="info">
            Paged by <a href='https://github.com/PharaohKJ'>Masayuki KaToH</a>. Hosted this page by <a
                href='https://github.com/'>GitHub</a>.
        </p>
    </div>
</footer>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
    const hashtagsInput = document.getElementById('hashtags');
    const copyButton = document.getElementById('copyButton');
    const openXButton = document.getElementById('openXButton');
    const shareButton = document.getElementById('shareButton');
    const copyUrlButton = document.getElementById('copyUrlButton');
    const pageUrl = document.getElementById('pageUrl');
    const pageQrCode = document.getElementById('pageQrCode');
    const hashtagCopyStatus = document.getElementById('hashtagCopyStatus');
    const status = document.getElementById('status');

    function normalizeHashtags(rawText) {
        return rawText
            .trim()
            .split(/\s+/)
            .filter(Boolean)
            .map((tag) => tag.startsWith('#') ? tag : `#${tag}`)
            .join(' ');
    }

    function getHashtagText() {
        return normalizeHashtags(hashtagsInput.value);
    }

    function showStatus(message) {
        status.textContent = message;
    }

    function showHashtagCopyStatus(message) {
        hashtagCopyStatus.textContent = message;
    }

    function getCurrentPageUrl() {
        return window.location.href;
    }

    function updateQrCodeDisplay() {
        const url = getCurrentPageUrl();
        pageQrCode.innerHTML = '';
        new QRCode(pageQrCode, {
            text: url,
            width: 180,
            height: 180
        });
    }

    function updatePageUrlDisplay() {
        pageUrl.textContent = getCurrentPageUrl();
        updateQrCodeDisplay();
    }

    function fillFromQuery() {
        const params = new URLSearchParams(window.location.search);
        const hashtagsParam = params.get('hashtags');
        if (!hashtagsParam) {
            return;
        }

        const normalized = normalizeHashtags(hashtagsParam);
        if (!normalized) {
            return;
        }

        hashtagsInput.value = normalized;
    }

    function updateQueryFromInput() {
        const params = new URLSearchParams(window.location.search);
        const text = getHashtagText();

        if (text) {
            params.set('hashtags', text);
        } else {
            params.delete('hashtags');
        }

        const query = params.toString();
        const nextUrl = `${window.location.pathname}${query ? `?${query}` : ''}${window.location.hash}`;
        window.history.replaceState(null, '', nextUrl);
        updatePageUrlDisplay();
    }

    fillFromQuery();
    updatePageUrlDisplay();
    hashtagsInput.addEventListener('input', updateQueryFromInput);

    copyButton.addEventListener('click', async () => {
        const text = getHashtagText();
        if (!text) {
            showHashtagCopyStatus('ハッシュタグを入力してください。');
            return;
        }

        try {
            await navigator.clipboard.writeText(text);
            showHashtagCopyStatus('コピーしました。');
        } catch (error) {
            showHashtagCopyStatus('コピーに失敗しました。ブラウザの権限をご確認ください。');
        }
    });

    openXButton.addEventListener('click', () => {
        const text = getHashtagText();
        if (!text) {
            showStatus('ハッシュタグを入力してください。');
            return;
        }

        const intentUrl = `https://twitter.com/intent/tweet?text=${encodeURIComponent(text)}`;
        window.open(intentUrl, '_blank', 'noopener,noreferrer');
        showStatus('X投稿画面を開きました。');
    });

    shareButton.addEventListener('click', async () => {
        const text = getHashtagText();
        if (!text) {
            showStatus('ハッシュタグを入力してください。');
            return;
        }

        if (!navigator.share) {
            showStatus('このブラウザはWeb Share APIに対応していません。');
            return;
        }

        try {
            await navigator.share({
                text
            });
            showStatus('シェアしました。');
        } catch (error) {
            if (error && error.name === 'AbortError') {
                showStatus('シェアをキャンセルしました。');
                return;
            }
            showStatus('シェアに失敗しました。');
        }
    });

    copyUrlButton.addEventListener('click', async () => {
        const url = getCurrentPageUrl();

        try {
            await navigator.clipboard.writeText(url);
            showStatus('URLをコピーしました。');
        } catch (error) {
            showStatus('URLのコピーに失敗しました。ブラウザの権限をご確認ください。');
        }
    });
</script>

</body>
</html>
